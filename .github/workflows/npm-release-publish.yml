name: Release and Publish

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_RELEASE_CHANGELOGS_SUADA_COMPONENTS  }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_CHANGELOGS_SUADA_COMPONENTS }}
        run: npx semantic-release

  publish:
    name: Publish to NPM
    needs: release
    runs-on: ubuntu-latest
    # id-token lets npm exchange a GitHub OIDC token for publish rights via the package's trusted publisher
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build package
        run: npm run build

      # Trusted publishing needs npm 11.5+; Node 20 ships npm 10. Pinned to 11 to avoid npm 12 install-time changes
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Publish to npm
        run: npm publish
