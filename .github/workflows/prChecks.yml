name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Docs-only changes need no build
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

# A newer push to the same PR cancels the run for the older commit
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, Lint, Build
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Lint compares against the base branch
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Each check runs even when an earlier one failed, so one run shows every problem
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      # Only the files this PR changed: the base branch still has older lint errors to burn down
      - name: Lint changed files
        if: ${{ !cancelled() }}
        run: |
          git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.ts' '*.tsx' ':!dist' > changedFiles.txt
          if [ -s changedFiles.txt ]; then xargs npx eslint < changedFiles.txt; else echo "No TypeScript files changed"; fi
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build
